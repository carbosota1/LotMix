name: LotMix - Intraday Runner
on:
  push:
    paths-ignore:
      - '**'
  schedule:
    - cron: "30 14 * * *"
    - cron: "15 16 * * *"
    - cron: "40 16 * * *"
    - cron: "15 17 * * *"
    - cron: "10 20 * * *"
    - cron: "15 22 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:
concurrency:
  group: lotmix-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-22.04
    env:
      TZ: America/Santo_Domingo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE_NOTIFY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITEA_TOKEN }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5; do
            if [ -f requirements.txt ]; then
              pip install --timeout 60 -r requirements.txt && break
            else
              pip install --timeout 60 pandas openpyxl requests beautifulsoup4 lxml && break
            fi
            echo "pip install falló, reintentando en 10s..."
            sleep 10
          done
      - name: Run runner
        run: |
          python src/runner.py
      - name: Commit and push changes (histories/state/outputs)
        run: |
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@noreply.local"
          rm -rf src/__pycache__ src/scrapers/__pycache__ || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update histories + intraday analysis"
          for i in 1 2 3 4 5; do git push --force && break || sleep 10; done
